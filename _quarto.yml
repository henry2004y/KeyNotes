project:
  type: book
  output-dir: docs

book:
  title: "Key Notes in Plasma Physics"
  author: "Hongyang Zhou"
  repo-url: https://github.com/henry2004y/KeyNotes/
  repo-branch: master
  repo-actions: [edit, issue]
  date: last-modified
  search: true
  page-navigation: true
  chapters:
    - index.qmd
    - contents/about.qmd

    - part: "Foundations & Preliminaries"
      chapters:
        - contents/introduction.qmd
        - contents/math.qmd
        - contents/theoretical_mechanics.qmd
        - contents/relativity.qmd
        - contents/unit.qmd

    - part: "Single-Particle Dynamics"
      chapters:
        - contents/single.qmd
        - contents/gc.qmd

    - part: "Fluid & Magnetohydrodynamic Theory"
      chapters:
        - contents/fluid.qmd
        - contents/diffres.qmd
        - contents/emhd.qmd
        - contents/boundary.qmd

    - part: "Waves, Kinetic Theory & Instabilities"
      chapters:
        - contents/wave.qmd
        - contents/kinetic.qmd
        - contents/dispersion.qmd
        - contents/stability.qmd
        - contents/kmhd.qmd
        - contents/gyrokinetics.qmd
        - contents/nonlinear.qmd
        - contents/turbulence.qmd

    - part: "Space & Astrophysical Plasmas"
      chapters:
        - contents/reconnection.qmd
        - contents/shock.qmd
        - contents/solarwind.qmd
        - contents/magnetosphere.qmd
        - contents/flr.qmd
        - contents/ionosphere.qmd
        - contents/radiationbelt.qmd
        - contents/aurora.qmd
        - contents/cr.qmd
        - contents/geometry.qmd

    - part: "Computational Plasma Physics"
      chapters:
        - contents/pic.qmd
        - contents/hybrid.qmd
        - contents/raytracing.qmd
        - contents/test.qmd

    - contents/references.qmd

  appendices:
    - contents/inductance.qmd
    - contents/capacitance.qmd
    - contents/appendix.qmd

bibliography: files/bibliography.bib

format:
  html:
    theme:
      light: cosmo
      dark: [cosmo, theme-dark.scss]
    toc: true
    toc-depth: 3
    number-depth: 3
    code-fold: true
    code-copy: true
    link-external-newwindow: true
    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true
    smooth-scroll: true
  pdf:
    documentclass: scrreprt
    include-in-header:
      text: |
        \usepackage{cancel}
        \usepackage{centernot}

execute:
  enabled: false
  freeze: true
